server:
  port: 8081

tencent:
  secret-id: ${TENCENT_SECRET_ID:}
  secret-key: ${TENCENT_SECRET_KEY:}
  region: ${TENCENT_REGION:ap-beijing}

spring:
  datasource:
    url: ${IDPHOTO_DB_URL:jdbc:h2:file:./data/idphoto;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${IDPHOTO_DB_USER:sa}
    password: ${IDPHOTO_DB_PASSWORD:}
    driver-class-name: ${IDPHOTO_DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

idphoto:
  storage-dir: ${IDPHOTO_STORAGE_DIR:./data/orders}
  default-amount-cent: ${IDPHOTO_DEFAULT_AMOUNT_CENT:390}
  download-token-ttl-hours: ${IDPHOTO_DOWNLOAD_TOKEN_TTL_HOURS:168}
  admin-token: ${IDPHOTO_ADMIN_TOKEN:change-me}
  create-throttle-seconds: ${IDPHOTO_CREATE_THROTTLE_SECONDS:20}
